[package]
name = "convert-link"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "convert_link"
path = "src/main.rs"

[[bin]]
name = "convert_link_animations"
path = "src/bin/convert_link_animations.rs"

[features]
# J3D fixture builders, shared by the unit tests and tests/animation_cli.rs.
# Off by default so they stay out of the shipped binaries.
fixtures = []

[dependencies]
gx.workspace = true

anyhow.workspace = true
glam.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
convert-link = { path = ".", features = ["fixtures"] }
insta.workspace = true
